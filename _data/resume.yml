# 数据格式可以为 yaml(文件以.yml结尾) 或者json(文件以.json结尾)
# 如果YAML格式的数据请先检查格式是否有误，可选检查工具 http://www.yamllint.com

title: "简历标题"
lang: "zh" #语言设置 zh表示中文 en 表示英语
name: "你的名字"
jobtitle: "求职意向" #可空不显示
photo: "assets/img/photo.jpg" #照片可空，不显示

#联系方式
contact: #联系方式连接等3~5行
- text: "youremail@example.com" #文本内容
  href: 'mailto:youremail@example.com' #链接，无链接则空  
  icon: 'icons/email.svg' #图标 svg文件
- text: "1234567890"
  href: 'tel:1234567890'
  icon: 'icons/phone.svg'


  attr: 'target="_blank"' #新标签页打开
  # - text: "地址"
  #   icon: "icons/location.svg"

#main下面是主体内容，类别条数不限
main: #简历主要内容，
- type: education #类别为ID
  name: 教育 #显示名称，空则使用type
  content: #内容基本格式 标题-副标题-日期-详细内容 (都允许空)
  - title: 大学名称
    duration: "2011年x月 - 2015年"
    sub: 地点或学历
    detail: 专业或者简短说明



- type: 爱好特长
  # name: "技能"
  content:
  - title: 体育
    items: #itmems 可以小块的方式显示
    - 足球
    - 网球
    - 乒乓球
    - 篮球
    - 跑步
  - title: 文艺
    items: #itmems 可以小块的方式显示
    - 钢琴
    - 黑管
    - 舞蹈

- type: skills
  # name: "技能"
  content:
  - title: 编程语言
    items: #itmems 可以小块的方式显示
    - 汉语
    - 语言2
    - 语言3
  - title: Skill Group
    summary: Consectetur, Adipiscing, Elit


- type: experience1
  name: 111
  content:
  - title: 职位
    sub: 某某公司
    duration: "xxxx年xx月 - yyyy年yy月"
    tags:
    - 标签
    summary: 职务或者工作总结(自动折叠)
    detail: 同时包含 summary和detail在Chrome，Safari(包括IOS)，Android和新版Firefox等会自动折叠，不支持折叠的浏览器和展开后表现一致
    # open: open
    #可以设置open默认展开
 

- type: experience
  name: 相关经验
  content:
  - title: 深圳中学REI机器人社
    duration: xxxx年xx月 - yyyy年yy月
    detail: 宣传招新，百团摊位布设，社课活动开展
    sub: 社长
  - title: 华南创新商业模拟大赛
    summary: Projects' introduction or summary
    open: open
    detail:
      md: _data/demo.md
    sub: 组委
   #可继续添加更多内容

